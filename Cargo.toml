[package]
name = "ollama-gguf"
version = "1.0.0"
edition = "2024"
description = "Install GGUF models into Ollama from a Hugging Face link or a local file"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
ctrlc = "3.5.2"
dialoguer = "0.12.0"
indicatif = "0.18.6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
ureq = { version = "3.4.2", features = ["json", "platform-verifier", "win-system-proxy"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

# small, fast, self-contained release exe
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
